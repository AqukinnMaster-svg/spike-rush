<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Holo Volleyball</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;--bs:1;--op:.75}

#ui.off{display:none}#ui.clr{background:rgba(6,10,28,.4)}
h1{margin:0;font-size:34px;letter-spacing:2px;background:linear-gradient(90deg,#7cf,#fc6);-webkit-background-clip:text;color:transparent}h2,h3{margin:4px}
.b{min-width:210px;padding:12px 18px;border:0;border-radius:14px;background:linear-gradient(#3b82f6,#1d4ed8);color:#fff;font-size:18px;font-weight:700}.b.g{background:linear-gradient(#475569,#334155)}.b.m{background:linear-gradient(#a855f7,#6d28d9)}.b.c{background:linear-gradient(#f59e0b,#b45309)}
label{display:block;margin:5px;font-size:14px}input[type=range]{width:160px;vertical-align:middle}

#scr{font-size:24px}#mg{font-size:22px;color:#ffd666;min-height:28px;margin-top:40px}

.cb{position:fixed;z-index:5;width:calc(76px*var(--bs));height:calc(76px*var(--bs));border-radius:50%;background:rgba(255,255,255,calc(var(--op)*.3));border:2px solid rgba(255,255,255,var(--op));display:flex;align-items:center;justify-content:center;font:700 11px system-ui;text-align:center;transform:translate(-50%,-50%);touch-action:none}

</style></head><body>
<div id=hud><div id=scr></div><div id=mg></div></div><button class="b g" id=pb onclick=pm()>Practice ▾</button>
<div id=ctl><div class=cb id=stick><i id=knob></i></div><div class=cb id=jump>JUMP</div><div class=cb id=act>RECEIVE</div><div class=cb id=set>SET</div><div class=cb id=dive>DIVE</div></div>
<div id=ui></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ===== TUNING (edit these) =====
const G=14,PG=26,WALK=3.8,RUN=6.2,JV=9,BR=.11,NETH=2.43,SERVE_Y=1.1,FACE=0; // ball gravity, player gravity, speeds, jump velocity, ball radius, net height
const $=i=>document.getElementById(i),V=THREE.Vector3,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const DEF={stick:[14,74],jump:[93,50],act:[80,70],set:[67,85],dive:[93,82]},IDS=Object.keys(DEF);
const S=Object.assign({name:'Player',col:'#ffcc33',fov:62,rf:10,bs:1,op:.75,mv:.7,sv:.8,mu:.5,q:1,sh:1,lay:{},games:0,wins:0,loss:0,pts:0,spikes:0},JSON.parse(localStorage.vb||'{}'));
const save=()=>localStorage.vb=JSON.stringify(S);
// ===== scene =====
const R=new THREE.WebGLRenderer({antialias:true});document.body.prepend(R.domElement);R.shadowMap.enabled=true;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0e1633);sc.fog=new THREE.Fog(0x0e1633,35,80);
const cam=new THREE.PerspectiveCamera(62,1,.1,120);
sc.add(new THREE.HemisphereLight(0xffffff,0x334466,.95));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(6,18,8);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-14,right:14,top:16,bottom:-16,far:50});sc.add(dl);
function plane(w,d,c,x,y,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;sc.add(m);return m}
plane(70,80,0x12203f,0,0,0);plane(15,24,0x2a6f97,0,.005,0);plane(9,18,0xe39b56,0,.01,0);plane(9,6,0xd4813a,0,.012,0);
const ln=(w,d,x,z)=>plane(w,d,0xffffff,x,.02,z);ln(9.1,.07,0,9);ln(9.1,.07,0,-9);ln(.07,18,4.5,0);ln(.07,18,-4.5,0);ln(9,.07,0,0);ln(9,.06,0,3);ln(9,.06,0,-3);
const cv=document.createElement('canvas');cv.width=cv.height=32;const g2=cv.getContext('2d');g2.strokeStyle='#fff';g2.lineWidth=2;g2.strokeRect(0,0,32,32);const nt=new THREE.CanvasTexture(cv);nt.wrapS=nt.wrapT=THREE.RepeatWrapping;nt.repeat.set(45,5);
const net=new THREE.Mesh(new THREE.PlaneGeometry(9.2,1),new THREE.MeshBasicMaterial({map:nt,transparent:true,side:2}));net.position.y=NETH-.5;sc.add(net);
const bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;sc.add(m);return m};
bx(9.2,.08,.04,0xffffff,0,NETH-.04,0);[-4.8,4.8].forEach(x=>bx(.12,2.6,.12,0xcccccc,x,1.3,0));
bx(60,12,.5,0x1b2a55,0,6,-17);bx(60,12,.5,0x1b2a55,0,6,17);bx(.5,12,40,0x1b2a55,-20,6,0);bx(.5,12,40,0x1b2a55,20,6,0);
bx(40,.3,.5,0xffd166,0,3,-16.7);bx(40,.3,.5,0x4dd0e1,0,3,16.7);
const cr=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,.9,.4),new THREE.MeshStandardMaterial(),240),dm=new THREE.Object3D();let ci=0;
for(let r=0;r<4;r++)for(let k=0;k<30;k++){[-1,1].forEach(sd=>{if(ci>=240)return;dm.position.set(sd*(11+r*.9),.6+r*.7,-14.5+k);dm.updateMatrix();cr.setMatrixAt(ci,dm.matrix);cr.setColorAt(ci++,new THREE.Color().setHSL(Math.random(),.6,.55))})}
sc.add(cr);
const cross=new THREE.Mesh(new THREE.RingGeometry(.25,.35,24),new THREE.MeshBasicMaterial({color:0x44ffcc,side:2,transparent:true,opacity:.8}));cross.rotation.x=-Math.PI/2;sc.add(cross);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.06,8,28),new THREE.MeshBasicMaterial({color:0xffe14d}));ring.visible=false;sc.add(ring);
// ===== assets =====
const CH={myth:[],council:[]};let ballSrc=null;const gl=new THREE.GLTFLoader();
const load=u=>new Promise(r=>gl.load(u,g=>r(g.scene),null,()=>r(null)));
function chars(s){const st=new Set();s.traverse(o=>{if(o.isSkinnedMesh){o.frustumCulled=false;o.castShadow=true;st.add(o.parent)}});return[...st].map(n=>{n.updateWorldMatrix(true,false);return{node:n,W:n.matrixWorld.clone(),name:n.name.replace(/(BeegSmol|Smol|rig.*)/gi,'')||'Hero'}})}
Promise.all([load('smol_holomyth_alternative_textures_.glb'),load('beegsmol_councilrys_-_hololive_en.glb'),load('volleyball.glb')]).then(([a,b,c])=>{if(a)CH.myth=chars(a);if(b)CH.council=chars(b);ballSrc=c;mkBall();menu()});
// ===== ball =====
const B={m:new THREE.Group(),p:new V3(0,1,8),v:new V3(),st:'rest',team:0,touches:0,sp:1,last:0,wob:0,tossed:0,cool:0,rt:0,srv:0};sc.add(B.m);
function mkBall(){B.m.clear();let o;if(ballSrc){o=ballSrc.clone(true);const bb=new THREE.Box3().setFromObject(o),sz=bb.getSize(new V3()),c=bb.getCenter(new V3());o.position.sub(c);const w=new THREE.Group();w.add(o);w.scale.setScalar(BR*2/Math.max(sz.x,sz.y,sz.z));o=w}else o=new THREE.Mesh(new THREE.SphereGeometry(BR,16,12),new THREE.MeshStandardMaterial({color:0xffffff}));o.traverse(m=>m.castShadow=true);B.m.add(o)}
mkBall();
// ===== state =====
let P=[],U=null,mode='menu',ph='',T=0,tm=0,sco=[0,0],srvT=0,su=0,edit=0,prM='',tossWho=0,pend={},Hd={},clock=new THREE.Clock(),introT=0,jx=0,jz=0,run=0,keyv={x:0,z:0,r:0},uiOn=1;
const reach=(p,rx,y0,y1)=>{const b=B.p;return Math.hypot(b.x-p.x,b.z-p.z)<rx&&b.y>p.y+y0&&b.y<p.y+y1};
function mkP(team,ch,ai){const g=new THREE.Group(),inn=new THREE.Group();g.add(inn);g.rotation.order='YXZ';sc.add(g);let s=1;
 if(ch&&ch.node){inn.add(ch.node);ch.W.decompose(ch.node.position,ch.node.quaternion,ch.node.scale);g.updateMatrixWorld(true);const bb=new THREE.Box3(),tv=new V3();ch.node.traverse(o=>{if(o.isBone){o.getWorldPosition(tv);bb.expandByPoint(tv)}});const h=Math.max(bb.max.y-bb.min.y,.01);s=1.75/(h*1.12);inn.scale.setScalar(s);inn.position.y=-bb.min.y*s}
 else{inn.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.2,12),new THREE.MeshStandardMaterial({color:team?0xe74c3c:0x3498db})),{position:new V3(0,.7,0)}),Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),new THREE.MeshStandardMaterial({color:0xffddbb})),{position:new V3(0,1.55,0)}))}
 const p={g,inn,s,team,s_:team?-1:1,ai,name:ch?ch.name:'Bot',x:0,y:0,z:0,vx:0,vy:0,vz:0,tvx:0,tvz:0,face:team?0:Math.PI,sq:0,stun:0,dv:0,rec:0,cool:0,req:null,idx:0,hx:0,hz:0};
 if(!ai){const r=new THREE.Mesh(new THREE.RingGeometry(.5,.62,24),new THREE.MeshBasicMaterial({color:S.col,side:2}));r.rotation.x=-Math.PI/2;r.position.y=.04;g.add(r)}return p}
function setP(list){P.forEach(p=>sc.remove(p.g));P=list;U=P.find(p=>!p.ai)}
function home(p,srv){const s=p.s_,h=[[0,6.2],[-2.8,3.6],[2.8,3.6]][p.idx];p.hx=h[0];p.hz=s*h[1];if(srv){p.hx=0;p.hz=s*10.2}}
function place(p){p.x=p.hx;p.z=p.hz;p.y=p.vx=p.vz=p.vy=0;p.dv=0;p.stun=0;p.req=null;p.face=p.team?0:Math.PI}
// ===== flow =====
function msg(t,ms=1800){$('mg').textContent=t;clearTimeout(msg.t);if(ms)msg.t=setTimeout(()=>$('mg').textContent='',ms)}
function hud(){$('scr').textContent=mode=='play'?`${S.name} ${sco[0]} : ${sco[1]} Opp`:''}
function body(c){document.body.className=c}
function scr(h,c=''){const u=$('ui');u.innerHTML=h;u.className=c;uiOn=1}
function hide(){$('ui').className='off';uiOn=0}
function menu(){mode='menu';body('');$('mg').textContent='';$('scr').textContent='';P.length&&setP([]);ring.visible=false;scr(`<h1>HOLO VOLLEYBALL</h1><button class=b onclick=pickTeam()>Play</button><button class="b g" onclick=pm0()>Practice</button><button class="b g" onclick=sets()>Settings</button><button class="b g" onclick=prof()>Profile</button><button class="b g" onclick=quit()>Quit</button>${CH.myth.length?'':'<small>Loading/!no models: place .glb files next to index.html and serve over http</small>'}`)}
function quit(){try{window.close()}catch(e){}scr('<h2>Thanks for playing!</h2><button class=b onclick=menu()>Back</button>')}
function pickTeam(){scr(`<h2>Choose your team</h2><button class="b m" onclick=startPlay('myth')>Myth</button><button class="b c" onclick=startPlay('council')>Council</button><button class="b g" onclick=menu()>Back</button>`)}
function trio(k){const a=[...CH[k]].sort(()=>Math.random()-.5);return[0,1,2].map(i=>a[i]||null)}
function startPlay(k){const o=k=='myth'?'council':'myth',a=trio(k),b=trio(o),l=[];a.forEach((c,i)=>{const p=mkP(0,c,i>0);p.idx=i;l.push(p)});b.forEach((c,i)=>{const p=mkP(1,c,1);p.idx=i;l.push(p)});setP(l);P.forEach(p=>{home(p);place(p)});
 mode='intro';introT=0;sco=[0,0];body('');scr('<h2>Get ready…</h2>','clr');setTimeout(()=>msg(`You are ${U.name}`,2500),100);ring.visible=false}
function coin(){scr(`<h2>Coin Toss</h2><p>You are <b>${U.name}</b>. Call it!</p><button class=b onclick=flip(0)>Heads</button><button class=b onclick=flip(1)>Tails</button>`)}
function flip(c){const r=Math.random()<.5?0:1;scr('<div id=coin>?</div>');setTimeout(()=>{$('coin').textContent=r?'TAILS':'HEADS';setTimeout(()=>{if(c==r)scr('<h2>You won the toss!</h2><button class=b onclick=first(0)>Serve first</button><button class=b onclick=first(1)>Receive first</button>');else{const s=Math.random()<.5?1:0;scr(`<h2>Opponent won the toss</h2><p>They chose to ${s?'serve':'receive'} first.</p><button class=b onclick=first(${s?1:0},1)>Start</button>`)}},900)},1800)}
function first(rec,opp){const st=opp?(rec?0:1):(rec?1:0);hide();mode='play';body('play noprac');srvT=st;ph='';newRally()}
function newRally(){ph='serve';P.forEach(p=>{home(p);});const sv=P.find(p=>p.team==srvT&&p.idx==0);home(sv,1);P.forEach(place);B.st='held';B.holder=sv;B.tossed=0;B.touches=0;B.team=srvT;B.last=srvT;su=sv==U?1:0;tm=T+1.8;ring.visible=false;hud();msg(su?'Your serve!':'Opponent serves',1500)}
function point(w,why){sco[w]++;ph='dead';tm=T+2.2;srvT=w;if(w==0){S.pts++;if(B.spk&&B.lastU)S.spikes++}msg((w?'Opponent':'Your team')+' scores! '+why,2000);hud();
 if((sco[w]>=11&&sco[w]-sco[1-w]>=2)||sco[w]>=15){S.games++;w==0?S.wins++:S.loss++;save();mode='end';setTimeout(()=>{body('');scr(`<h2>${w==0?'🏆 You win!':'You lose'}</h2><h3>${sco[0]} : ${sco[1]}</h3><button class=b onclick=pickTeam()>Play again</button><button class="b g" onclick=menu()>Menu</button>`,'clr')},1800)}}
function landed(){const inn=Math.abs(B.p.x)<=4.55&&Math.abs(B.p.z)<=9.05,side=B.p.z>0?0:1,w=inn?1-side:1-B.last;B.p.y=BR;B.st='dead';B.rt=T;B.v.multiplyScalar(.35);B.v.y=3;su=0;ring.visible=false;
 if(mode=='play')point(w,inn?'':'(out)');else if(mode!='menu'){msg(prM=='set'&&B.setMiss?'Missed the ring':inn?'In!':'Out!',1000)}}
// ===== practice =====
function pm0(){startPrac('receive')}
function pm(){scr(`<h2>Practice</h2><button class=b onclick=startPrac('serve')>Serve</button><button class=b onclick=startPrac('receive')>Receive</button><button class=b onclick=startPrac('set')>Set</button><button class=b onclick=startPrac('spike')>Spike</button><button class="b g" onclick=hide()>Resume</button><button class="b g" onclick=menu()>Main menu</button>`,'clr')}
function startPrac(m){prM=m;mode='prac';const all=[...CH.myth,...CH.council].sort(()=>Math.random()-.5),u=mkP(0,all[0]||null,0),l=[u];u.idx=0;
 if(m=='set'||m=='spike'){const a=mkP(0,all[1]||null,1);a.idx=1;l.push(a)}setP(l);U.hx=0;U.hz=m=='serve'?10.2:m=='set'?3:5.5;P.forEach(p=>{if(p!=U){p.hx=m=='set'?-2.5:2.5;p.hz=m=='set'?5:2.5}place(p)});
 hide();body('play prac');ph='rally';sco=[0,0];hud();ring.visible=false;B.srv=0;if(m=='serve'){B.st='held';B.holder=U;B.tossed=0;su=1;B.touches=0;B.team=0}else{B.st='dead';B.rt=T-1}msg(m.toUpperCase()+' practice',1500)}
function launch(f,t,Tm,sp){B.p.copy(f);B.v.set((t.x-f.x)/Tm,(t.y-f.y)/Tm+.5*G*Tm,(t.z-f.z)/Tm);B.st='fly';B.sp=sp||1;B.cool=.1;B.setMiss=0}
function pracNext(){B.setMiss=0;ring.visible=false;B.spk=0;const m=prM;
 if(m=='serve'){B.st='rest';B.p.set(rnd(-2,2),BR,10.8);B.v.set(0,0,0);return}
 B.team=1;B.touches=1;B.last=1;B.srv=0;
 if(m=='receive'){const k=Math.random(),t=new V3(rnd(-3.5,3.5),0,rnd(1.5,8));if(k<.34)launch(new V3(rnd(-3,3),2,-9),t,1.9,1);else if(k<.67)launch(new V3(rnd(-3,3),2.5,-9),t,1.25,1.4);else launch(new V3(rnd(-3,3),3,-2.5),t,.6,1.9);msg(k<.34?'Toss':k<.67?'Serve':'Spike!',900)}
 else if(m=='set'){const a=P[1];a.hx=pick([-3,-2,2,3]);a.hz=rnd(4,7);launch(new V3(rnd(-3,3),2,-9),new V3(a.hx,1,a.hz),1.8,1)}
 else{const a=P[1];a.hx=rnd(-3.5,3.5);a.hz=rnd(1.5,6.5);B.team=0;B.touches=0;B.last=0;launch(new V3(rnd(-3,3),1,8.7),new V3(a.hx,1.2,a.hz),1.5,1)}}
// ===== hitting =====
function hit(p,k,o={}){const s=p.s_,b=B.p,t=new V3();let Tm=1,sp=1.15,err=o.err||0;
 if(k=='block'){const pw=o.pow||0;B.v.z=-B.v.z*(.4+.8*pw);B.v.x*=.5;B.v.y=-(1+4*pw);B.sp=1.3;B.team=p.team;B.touches=0;B.last=p.team;B.cool=.2;p.sq=.2;return}
 if(k=='bump'||k=='dive'){t.set(rnd(-1,1),2.7,s*2.2);if(p==U){t.x=jx*2;t.z=s*2.2+jz*1.5}if(prM=='set'&&p.ai){t.set(U.x,2.6,U.z)}Tm=1.2;err+=k=='dive'?1:.3;
  if(prM=='spike'&&p.ai){t.set(U.x+rnd(-.4,.4),3.1,s*cl(U.z,1.5,4));Tm=1;sp=1.1}}
 else if(k=='set'){if(o.t){t.copy(o.t);Tm=.8+.06*Math.hypot(t.x-b.x,t.z-b.z)}else{t.set(pick([-3,3]),3,s*1.3);Tm=.95;if(prM=='spike'){t.set(U.x+rnd(-.4,.4),3.1,s*cl(U.z,1.5,4))}}}
 else if(k=='up'){B.v.set(0,8,0);B.team=p.team;B.touches++;B.cool=.2;B.last=p.team;return}
 else if(k=='over'){t.set(rnd(-3,3),0,-s*rnd(3,7));Tm=1.5}
 else if(k=='spike'){const pw=o.pow||0;if(p==U){t.set(U.x*.4+jx*4,0,-s*cl(5.5-jz*4,2.5,8.5))}else t.set(rnd(-3.5,3.5),0,-s*rnd(2,8));Tm=Math.max(.38,.8-.42*pw);sp=1.9;if(p==U)B.spk=1}
 else if(k=='serve'){const pw=o.pow||0,ty=o.ty;t.set(rnd(-3,3),0,-s*(ty=='hold'?3+pw*5.5:rnd(3.5,8)));if(p==U)t.x=cl(U.x*.5+jx*3,-4,4);Tm=ty=='double'?1.3:1.55;sp=1.5;if(o.jump){Tm=ty=='hold'?.75-.3*pw:ty=='double'?1.05:1.1;sp=ty=='hold'?2:1.6}B.wob=(ty=='double')?1:0}
 t.x+=rnd(-err,err);t.z+=rnd(-err,err);const f=b.clone();B.v.set((t.x-f.x)/Tm,(t.y-f.y)/Tm+.5*G*Tm,(t.z-f.z)/Tm);
 if(f.z*t.z<0){const tc=Math.abs(f.z)/Math.abs(B.v.z),y=f.y+B.v.y*tc-.5*G*tc*tc;if(y<NETH+.3)B.v.y+=(NETH+.3-y)/tc}
 B.sp=sp;B.cool=.2;B.st='fly';if(k!='serve'||1){B.touches=(B.team==p.team&&!(k=='serve'))?B.touches+1:1;B.team=p.team}B.last=p.team;B.lastU=p==U;B.srv=k=='serve';p.sq=.25;
 if(k!='spike')B.spk=0;if(prM=='set'&&p.ai&&B.touches==1){ring.position.set(rnd(-3.6,3.6),rnd(2.6,3.4),rnd(1,3.2));let n=0;while(Math.hypot(ring.position.x-U.x,ring.position.z-U.z)<2&&n++<9)ring.position.x=rnd(-3.6,3.6);ring.visible=true;ring.material.color.set(0xffe14d);B.setMiss=1}}

function mov(p,dt){const s=p.s_;if(p.dv>0){p.vx=p.dvx*7;p.vz=p.dvz*7;p.dv-=dt;if(p.dv<=0){p.stun=.5}}else{p.vx+=(p.tvx-p.vx)*Math.min(1,dt*10);p.vz+=(p.tvz-p.vz)*Math.min(1,dt*10)}

function collide(){for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(Math.abs(a.y-b.y)>1.2)continue;let dx=b.x-a.x,dz=b.z-a.z;const d=Math.hypot(dx,dz);if(d<.75&&d>0){dx/=d;dz/=d;const o=(.75-d)/2;a.x-=dx*o;a.z-=dz*o;b.x+=dx*o;b.z+=dz*o;a.vx-=dx*4;a.vz-=dz*4;b.vx+=dx*4;b.vz+=dz*4;a.sq=b.sq=.35;[a,b].forEach(p=>{if(Math.hypot(p.vx,p.vz)>2){p.stun=.35;p.req=null;p.dv=0}})}}}
function ballStep(dt){const b=B.p;
 if(B.st=='held'){const h=B.holder;b.set(h.x,h.y+SERVE_Y,h.z-h.s_*.3);B.v.set(0,0,0)}
